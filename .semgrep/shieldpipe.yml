rules:
  - id: sql-built-from-string
    message: >-
      SQL text is built from a formatted or concatenated string. Use SQLAlchemy
      expressions or bound parameters (text("... :value").bindparams(value=...))
      so that user input can never change the query.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
    pattern-either:
      - pattern: sqlalchemy.text(f"...")
      - pattern: sqlalchemy.text("..." % ...)
      - pattern: sqlalchemy.text("...".format(...))
      - pattern: sqlalchemy.text("..." + ...)
      - pattern: $DB.execute(f"...", ...)
      - pattern: $DB.execute("..." % ..., ...)
      - pattern: $DB.execute("...".format(...), ...)
      - pattern: $DB.execute("..." + ..., ...)

  - id: jwt-decode-without-fixed-algorithms
    message: >-
      jwt.decode() must receive an explicit algorithms=[...] list. Without it the
      token's own header chooses the algorithm ("alg: none", algorithm confusion).
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    patterns:
      - pattern: jwt.decode(...)
      - pattern-not: jwt.decode(..., algorithms=[...], ...)
      - pattern-not: jwt.decode(..., algorithms=$ALGS, ...)

  - id: jwt-signature-verification-disabled
    message: JWT signature verification is disabled; any forged token would be accepted.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'

  - id: secret-written-to-logs
    message: >-
      A value that looks like a credential is written to the logs. Logs are shipped
      to the SIEM and read by many people: never log passwords, tokens or keys.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: MEDIUM
    pattern-either:
      - patterns:
          - pattern: $LOGGER.$METHOD(..., $VALUE, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|error|exception|critical|log)$
          - metavariable-regex:
              metavariable: $VALUE
              regex: (?i)^[\w.]*(password|passwd|secret|token|api_key|credentials?)[\w.]*$
      - patterns:
          - pattern: audit(..., $FIELD=$VALUE, ...)
          - metavariable-regex:
              metavariable: $VALUE
              regex: (?i)^[\w.]*(password|passwd|secret|token|api_key|credentials?)[\w.]*$

  - id: fastapi-debug-enabled
    message: FastAPI debug mode returns stack traces to clients. Keep it off outside local development.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH
    pattern: fastapi.FastAPI(..., debug=True, ...)
