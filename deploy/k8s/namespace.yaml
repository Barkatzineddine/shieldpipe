apiVersion: v1
kind: Namespace
metadata:
  name: shieldpipe
  labels:
    # Pod Security Admission: the API server rejects any pod that breaks the
    # "restricted" profile (root, privileged, host namespaces, extra capabilities...).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
