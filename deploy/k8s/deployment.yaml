apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldpipe
  labels:
    app.kubernetes.io/name: shieldpipe
spec:
  # One replica: SQLite and the in-memory login throttle are per-process.
  # Scaling out needs PostgreSQL and Redis (see docs/threat-model.md).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shieldpipe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shieldpipe
    spec:
      serviceAccountName: shieldpipe
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: shieldpipe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SHIELDPIPE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shieldpipe-secrets
                  key: jwt-secret
            - name: SHIELDPIPE_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: SHIELDPIPE_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shieldpipe-secrets
                  key: admin-password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; these are the only writable paths.
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
