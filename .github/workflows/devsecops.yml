name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job asks only for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: shieldpipe:local
  # Every third-party tool is pinned to an exact version and image digest.
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
  HADOLINT: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  CONFTEST: openpolicyagent/conftest:v0.71.1@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0
  KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  ZAP: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

jobs:
  # ------------------------------------------------------------------ stage 1: code
  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false
      - name: Scan git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS" git --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  lint-test:
    name: Lint & tests (ruff, Bandit, pytest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .
      - name: Unit and security tests (coverage gate 90%)
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Bandit (Python security linter)
        run: bandit -c pyproject.toml -r app --severity-level low -f sarif -o bandit.sarif
      - name: Upload Bandit findings
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  sast:
    name: SAST (Semgrep, custom + OWASP rules)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the custom rules first
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP" \
            semgrep --test --metrics=off --config .semgrep/shieldpipe.yml .semgrep/shieldpipe.py
      - name: Scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP" \
            semgrep scan --metrics=off --error \
              --config .semgrep/shieldpipe.yml \
              --config p/python --config p/owasp-top-ten --config p/secrets --config p/dockerfile \
              --sarif-output=semgrep.sarif --text
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: Dependencies (pip-audit, Trivy fs)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Known vulnerabilities in runtime dependencies (OSV / PyPA advisories)
        run: pip-audit -r requirements.txt --require-hashes --disable-pip --strict --desc
      - name: Trivy filesystem scan (report)
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$HOME/.cache/trivy:/cache" \
            -e TRIVY_CACHE_DIR=/cache "$TRIVY" fs --scanners vuln,secret,misconfig \
            --format sarif --output /src/trivy-fs.sarif /src
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy gate (HIGH and CRITICAL)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$HOME/.cache/trivy:/cache" \
            -e TRIVY_CACHE_DIR=/cache "$TRIVY" fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 /src

  iac:
    name: IaC & policy-as-code (hadolint, kubeconform, OPA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -v "$PWD:/w" -w /w "$HADOLINT" hadolint --config .hadolint.yaml Dockerfile
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > rendered.yaml
      - name: Validate manifests against Kubernetes and CRD schemas
        run: |
          docker run --rm -v "$PWD:/w" "$KUBECONFORM" -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/rendered.yaml
      - name: Unit-test the Rego policies
        run: |
          docker run --rm -v "$PWD:/project" "$CONFTEST" verify --policy policy/kubernetes
          docker run --rm -v "$PWD:/project" "$CONFTEST" verify --policy policy/docker
      - name: Enforce policies on manifests and Dockerfile
        run: |
          docker run --rm -v "$PWD:/project" "$CONFTEST" test --policy policy/kubernetes rendered.yaml
          docker run --rm -v "$PWD:/project" "$CONFTEST" test --policy policy/docker Dockerfile

  # ---------------------------------------------------------------- stage 2: artifact
  build:
    name: Build, scan image & SBOM
    needs: [secrets, lint-test, sast, sca, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability report
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            -v "$HOME/.cache/trivy:/cache" -e TRIVY_CACHE_DIR=/cache "$TRIVY" image \
            --format sarif --output /out/trivy-image.sarif "$IMAGE"
      - name: Upload findings to GitHub Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Image gate (fixable HIGH and CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/cache" -e TRIVY_CACHE_DIR=/cache "$TRIVY" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            -v "$HOME/.cache/trivy:/cache" -e TRIVY_CACHE_DIR=/cache "$TRIVY" image \
            --format cyclonedx --output /out/sbom.cdx.json "$IMAGE"
          echo "SBOM components: $(jq '.components | length' sbom.cdx.json)"
      - name: Export the exact image that was scanned
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            image.tar.gz
            sbom.cdx.json
          retention-days: 3

  # -------------------------------------------------------------- stage 3: runtime tests
  dast:
    name: DAST (OWASP ZAP, authenticated API scan)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Start the API the way production runs it (read-only, no capabilities)
        run: |
          gunzip -c image.tar.gz | docker load
          ADMIN_PASSWORD="$(openssl rand -base64 30)"
          echo "::add-mask::$ADMIN_PASSWORD"
          docker run -d --name api -p 8000:8000 \
            --read-only --tmpfs /tmp --tmpfs /app/data:uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e SHIELDPIPE_JWT_SECRET="$(openssl rand -hex 32)" \
            -e SHIELDPIPE_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e SHIELDPIPE_BOOTSTRAP_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e SHIELDPIPE_EXPOSE_OPENAPI=true \
            -e SHIELDPIPE_ACCESS_TOKEN_TTL_MINUTES=60 \
            "$IMAGE"
          curl -sf --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8000/readyz
          TOKEN=$(curl -sf http://localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Seed data so the scanner exercises real records.
          curl -sf http://localhost:8000/api/v1/incidents -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"title":"Seed incident","severity":"low"}' > /dev/null
      - name: ZAP API scan with an authenticated session
        # Exit codes: 0 clean, 1 a FAIL rule fired, 2 warnings only, 3 scanner error.
        # Rules that must never fire are promoted to FAIL in .zap/rules.tsv;
        # warnings go to the report and the job summary for review.
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          rc=0
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            "$ZAP" zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
            -c rules.tsv -r zap-report.html -J zap-report.json -w zap-report.md || rc=$?
          echo "ZAP exit code: $rc"
          echo "Alerts (risk, reference, name):"
          jq -r '.site[].alerts[] | "  \(.riskdesc)\t\(.alertRef)\t\(.name)"' zap/zap-report.json
          serious=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 2)] | length' zap/zap-report.json)
          if [ "$serious" -gt 0 ]; then echo "::error::$serious Medium or High risk alert(s)"; exit 1; fi
          if [ "$rc" -eq 1 ] || [ "$rc" -ge 3 ]; then exit 1; fi
      - name: The audit trail was produced
        run: |
          docker logs api 2>&1 | grep '"type": "audit"' | tail -n 5
          test "$(docker logs api 2>&1 | grep -c '"event": "auth.login"')" -ge 1
      - name: Job summary
        if: always()
        run: test -f zap/zap-report.md && cat zap/zap-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14

  k8s-e2e:
    name: Deploy on Kubernetes (kind + Cilium) & verify runtime controls
    needs: build
    runs-on: ubuntu-24.04
    env:
      CILIUM_CLI_VERSION: v0.20.1
      CILIUM_CLI_SHA256: 24e817dcfcc8a12e325ce7547617bcbcf171c5b0b335bb24d2bb1207ba047f61
      CILIUM_VERSION: 1.20.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Create a kind cluster without the default CNI
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: shieldpipe
          wait: 0s # nodes stay NotReady until Cilium is installed
      - name: Install Cilium (checksum-verified CLI)
        run: |
          curl -sSfL -o cilium.tgz \
            "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"
          echo "${CILIUM_CLI_SHA256}  cilium.tgz" | sha256sum --check
          sudo tar -xzf cilium.tgz -C /usr/local/bin cilium
          cilium install --version "$CILIUM_VERSION"
          cilium status --wait --wait-duration 8m
      - name: Load the scanned image into the cluster
        run: |
          gunzip -c image.tar.gz | docker load
          kind load docker-image "$IMAGE" --name shieldpipe
      - name: Deploy and verify security controls
        run: bash scripts/e2e.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n shieldpipe describe pods
          kubectl -n shieldpipe logs deploy/shieldpipe --tail=100 || true
          cilium status || true

  # ------------------------------------------------------------------ stage 4: release
  publish:
    name: Publish signed image (GHCR, cosign, SLSA provenance)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [dast, k8s-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed every gate
        id: push
        run: |
          gunzip -c image.tar.gz | docker load
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE" "$repo:${GITHUB_SHA::12}"
          docker push "$repo:${GITHUB_SHA::12}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:${GITHUB_SHA::12}" | cut -d@ -f2)
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attach the SBOM (keyless, Sigstore)
        env:
          REF: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify what we just published
        env:
          REF: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops.yml@refs/heads/main
        run: |
          cosign verify "$REF" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "### Published"
            echo "\`$REF\`"
            echo
            echo "Signature and SBOM attestation verified against \`$IDENTITY\`."
          } >> "$GITHUB_STEP_SUMMARY"
